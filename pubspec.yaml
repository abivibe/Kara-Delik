name: karadelik
description: "Minimalist AMOLED BlackHole-style video downloader for Windows."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  path_provider: ^2.1.5
  intl: ^0.19.0
  path: ^1.9.0
  youtube_explode_dart: ^3.1.0
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
    - assets/app_icon.png
    - assets/sounds/bildirimtetik.mp3
    - assets/sounds/completed.mp3
